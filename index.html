<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e16" />
  <meta name="description" content="SquadUp — pick your spot in the 9v9 match lineup, live across every phone." />
  <title>SquadUp — Live 9v9 Match Lineup</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233ddc97'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230a0e16'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <!-- Brand -->
    <header class="brand">
      <span class="brand__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 3.2 3.3 2.4-1.3 3.9h-4l-1.3-3.9L12 5.2ZM5.6 9.9l3.3-.1 1.3 3.9-2.7 2.5-2.4-1.3.5-5Zm12.8 0 .5 5-2.4 1.3-2.7-2.5 1.3-3.9 3.3.1ZM9.2 18.6l2.8-1.9 2.8 1.9-.6 2.6a7.6 7.6 0 0 1-4.4 0l-.6-2.6Z"/></svg>
      </span>
      SquadUp
      <span class="brand__badge">Live</span>
    </header>

    <main class="screens">
      <!-- ===================== CREATE PROFILE ===================== -->
      <section class="screen" id="screen-create" aria-labelledby="create-title">
        <div class="screen__head">
          <button class="icon-btn" id="create-back" type="button" aria-label="Go back" hidden>
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
        </div>

        <p class="eyebrow">New player</p>
        <h1 class="title" id="create-title">Create your profile</h1>
        <p class="subtitle">Pick a name and choose an avatar. We save your player ID on this device so you can claim your spot in the match.</p>

        <div class="preview">
          <div class="preview__ring" id="create-preview"></div>
          <span class="preview__name" id="create-preview-name">Blaze</span>
        </div>

        <div class="field" id="name-field">
          <label class="field__label" for="name-input">Your name</label>
          <input
            class="field__input"
            id="name-input"
            type="text"
            inputmode="text"
            autocomplete="off"
            maxlength="18"
            placeholder="e.g. Alex Morgan"
          />
          <p class="field__error" id="name-error">Please enter a name (1–18 characters).</p>
        </div>

        <div class="field">
          <span class="field__label">Choose an avatar</span>
          <div class="avatar-grid" id="avatar-grid" role="radiogroup" aria-label="Avatar selection"></div>
        </div>

        <div class="actions actions--sticky">
          <button class="btn btn--primary" id="create-submit" type="button">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            Create profile
          </button>
        </div>
      </section>

      <!-- ===================== HOME ===================== -->
      <section class="screen" id="screen-home" aria-labelledby="home-name">
        <div class="profile-bar">
          <div class="profile-bar__avatar" id="home-avatar"></div>
          <div class="profile-bar__info">
            <h1 class="profile-bar__name" id="home-name">—</h1>
            <p class="profile-bar__since" id="home-since">—</p>
          </div>
          <div class="profile-bar__actions">
            <button class="icon-btn" id="home-switch" type="button" aria-label="Switch player" title="Switch player">
              <svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            </button>
          </div>
        </div>

        <div class="join-panel" id="join-panel"></div>

        <div class="match">
          <div class="match__legend">
            <span class="team-pill team-pill--blue"><i></i>Blue Team</span>
            <span class="conn-pill" id="conn-status"><i></i><span id="conn-text">Connecting</span></span>
            <span class="team-pill team-pill--orange"><i></i>Orange Team</span>
          </div>

          <div class="pitch">
            <svg class="pitch__lines" viewBox="0 0 100 140" preserveAspectRatio="none" aria-hidden="true">
              <rect x="2" y="2" width="96" height="136" rx="3"/>
              <line x1="2" y1="70" x2="98" y2="70"/>
              <circle cx="50" cy="70" r="12"/>
              <circle class="fill" cx="50" cy="70" r="1"/>
              <rect x="24" y="2" width="52" height="16" rx="1.5"/>
              <rect x="38" y="2" width="24" height="6" rx="1"/>
              <circle class="fill" cx="50" cy="14" r="0.9"/>
              <rect x="24" y="122" width="52" height="16" rx="1.5"/>
              <rect x="38" y="132" width="24" height="6" rx="1"/>
              <circle class="fill" cx="50" cy="126" r="0.9"/>
              <path d="M50 2v-4M50 142v4" opacity=".25"/>
            </svg>
            <div class="pitch__slots" id="pitch-slots"></div>
          </div>

          <div class="bench" id="bench"></div>

          <button class="btn btn--share" id="share-lineup" type="button">
            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12 7.6L3 21l1.9-6A8.5 8.5 0 1 1 21 11.5Z"/></svg>
            Share Lineup
          </button>
        </div>
      </section>
    </main>
  </div>

  <!-- Bottom sheet: slot / team actions -->
  <div class="sheet" id="sheet" role="presentation">
    <div class="sheet__backdrop" data-sheet-close></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <span class="sheet__handle" aria-hidden="true"></span>
      <div class="sheet__head">
        <div>
          <p class="sheet__eyebrow" id="sheet-eyebrow"></p>
          <h2 class="sheet__title" id="sheet-title"></h2>
        </div>
        <button class="icon-btn" id="sheet-close" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="sheet__body" id="sheet-body"></div>
      <div class="sheet__foot" id="sheet-foot"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Firebase v10 compat SDK (works with classic scripts on static hosting) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <!-- App -->
  <script src="js/avatars.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/lineup.js"></script>
</body>
</html>
